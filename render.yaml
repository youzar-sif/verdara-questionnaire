services:
  - type: web
    name: verdara-questionnaire
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: verdara-data
      mountPath: /var/data
      sizeGB: 1
